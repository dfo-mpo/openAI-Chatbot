server {
    listen 80;
    server_name localhost;

    # Increase allowed file size (adjust value as needed)  
    client_max_body_size 10M;  

    root /usr/share/nginx/html;  
    index index.html;  

    # Serve static files generated from your React build.  
    location / {  
        try_files $uri $uri/ /index.html;  
    }  

    # Proxy API HTTP calls (adjust the rewrite if your backend doesn’t expect /api prefix)  
    location /api/ {  
        rewrite ^/api/(.*)$ /$1 break;  
        # proxy_pass http://backend:8000;  # For running locally
        proxy_pass http://localhost:8000;  # For running in Azure web apps
        proxy_http_version 1.1;  
        proxy_set_header Upgrade $http_upgrade;  
        proxy_set_header Connection "keep-alive";  
        proxy_set_header Host $host;  
        proxy_cache_bypass $http_upgrade;  
    }
}